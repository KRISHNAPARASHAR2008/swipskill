<script>
const K='skillswap_v1',e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const def=()=>({campus:{name:'My Campus',domain:'',verify:false,invite:Math.random().toString(36).slice(2,8)},users:[],reqs:[],msgs:[],sess:[],revs:[],notes:[],blocks:[],n:1});
let LOCAL=false,S=def(),DB=null,CID=null,ISOWNER=false,READY=false,NOACC=false,ERR='',VW=null,sid=null;
const COLS=['users','reqs','msgs','sess','revs','notes','blocks','lib'],LAST={};let wq=Promise.resolve();
const kf=(c,it)=>c+'/'+(it.id!=null?it.id:'b'+it.a+'_'+it.b);
const save=()=>{if(LOCAL){try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}return wq}if(!DB)return wq;const jobs=[],meta=JSON.stringify({campus:S.campus});if(LAST.meta!==meta)jobs.push(['app/meta',meta]);
 for(const c of COLS){const seen=new Set();for(const it of (S[c]=S[c]||[])){const k=kf(c,it),j=JSON.stringify(it);seen.add(k);if(LAST[k]!==j)jobs.push([k,j])}for(const k of Object.keys(LAST))if(k.startsWith(c+'/')&&!seen.has(k))jobs.push([k,null])}
 wq=wq.then(async()=>{for(const [k,j] of jobs){try{if(j===null){await DB.doc(k).delete();delete LAST[k]}else{await DB.doc(k).set({j});LAST[k==="app/meta"?"meta":k]=j}}catch(x){toast('Could not save: '+((x&&x.message)||x))}}});return wq};
const sync=()=>{if(LOCAL)return;const u=S.users.find(x=>x.cid===CID);sid=u?u.id:null};
const setMe=i=>{if(LOCAL){sid=i;try{localStorage.setItem('skillswap_sid',i==null?'':i)}catch(x){}}else sync()};
const me=()=>S.users.find(u=>u.id===sid),U=i=>S.users.find(u=>u.id===i),id=()=>Date.now()*1000+Math.floor(Math.random()*1000),now=()=>Date.now(),fd=t=>new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display='none',2600)};
const note=(to,text,link)=>S.notes.unshift({id:id(),to,text,link,read:0,t:now()});
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const hash=async s=>{if(!(window.crypto&&crypto.subtle)){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return'f'+h}return H(s)};const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');

const eligible=u=>!u.suspended&&(u.teach.length||u.learn.length);
const allSkills=()=>[...new Set(S.users.flatMap(u=>[...u.teach,...u.learn].map(s=>s.n)))];
const canon=n=>{n=n.trim().replace(/\s+/g,' ');return allSkills().find(s=>s.toLowerCase()===n.toLowerCase())||n};
const blocked=(a,b)=>S.blocks.some(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a));
const ov=(a,b)=>{const i=a.filter(x=>b.includes(x)).length,m=Math.min(a.length,b.length);return m?i/m:.5};
// ---- Matching engine: 40 reciprocal / 15 proficiency / 15 availability / 10 format / 10 language / 10 interests
function match(a,b){const g=a.teach.filter(t=>b.learn.some(l=>l.n.toLowerCase()===t.n.toLowerCase())),w=b.teach.filter(t=>a.learn.some(l=>l.n.toLowerCase()===t.n.toLowerCase()));
 if(!g.length&&!w.length)return null;const recip=(g.length?.5:0)+(w.length?.5:0);
 let pf=[],pr=1;[[a,b,g],[b,a,w]].forEach(([x,y,list])=>list.forEach(t=>{const l=y.learn.find(l=>l.n.toLowerCase()===t.n.toLowerCase());pf.push(LV.indexOf(t.l)>=LV.indexOf(l.l)?1:.4)}));if(pf.length)pr=pf.reduce((x,y)=>x+y)/pf.length;
 const av=(ov(a.days,b.days)+ov(a.times,b.times))/2,fm=a.fmt==='any'||b.fmt==='any'||a.fmt===b.fmt?1:0,
 la=ov(a.langs.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean),b.langs.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean)),
 ia=ov(a.interests.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean),b.interests.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean));
 const score=Math.round(recip*40+pr*15+av*15+fm*10+la*10+ia*10);
 return{score,g,w,why:(g.length&&w.length?'Reciprocal swap: ':'One-way (non-reciprocal): ')+(g.length?`you teach ${g.map(x=>x.n).join(', ')}`:'')+(g.length&&w.length?' and ':'')+(w.length?`they teach ${w.map(x=>x.n).join(', ')}`:'')+`. Availability overlap ${Math.round(av*100)}%.`,recip:g.length&&w.length}}
// ---- Actions
const F={
async signup(ev){try{await F.signup2(ev)}catch(x){toast('Signup failed: '+x.message)}return false},
async signup2(ev){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target)),em=f.email.trim().toLowerCase();
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return toast('Invalid email');const dm=S.campus.domain.trim().toLowerCase();
 if(dm&&!em.endsWith('@'+dm))return toast('Use your @'+dm+' campus email');if(S.users.some(u=>u.email===em))return toast('This email already has an account. Please log in.');

 const first=!S.users.length,u={id:id(),name:f.name.trim(),email:em,pw:await hash(f.pw),dept:f.dept,year:f.year,bio:'',interests:'',teach:[],learn:[],days:[],times:[],fmt:'any',langs:'English',dur:60,role:first?'admin':'student',verified:first||!S.campus.verify,suspended:0};
 S.users.push(u);save();setMe(u.id);toast(first?'You are the campus admin':'Welcome!');go('#/profile')},
async login(ev){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target)),u=S.users.find(x=>x.email===f.email.trim().toLowerCase());
 if(!u||u.pw!==await hash(f.pw))return toast('Invalid email or password');setMe(u.id);go('#/dashboard')},
verify(){toast('Your campus admin must verify your account')},unblock(o){S.blocks=S.blocks.filter(b=>!(b.a===sid&&b.b===o));save();toast('Unblocked');render()},finish(i){const r=S.reqs.find(x=>x.id===i);if(!r||r.status!=='accepted'||![r.from,r.to].includes(sid)||!S.sess.some(s=>s.rid===i&&s.status==='completed'))return;r.status='completed';r.hist.push({s:'completed',t:now()});note(r.from===sid?r.to:r.from,'Swap marked finished: you can leave a review','#/reviews');save();toast('Swap finished: leave a review');go('#/reviews')},
prof(ev){ev.preventDefault();const f=new FormData(ev.target),u=me();['name','dept','year','bio','interests','langs'].forEach(k=>u[k]=f.get(k));u.fmt=f.get('fmt');u.dur=+f.get('dur');u.days=f.getAll('d');u.times=f.getAll('t');save();toast('Profile saved');render()},
skill(ev){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target)),u=me(),n=canon(f.n);if(!n)return;const list=u[f.k];

rm(k,i){me()[k].splice(i,1);save();render()},
sendReq(ev,to){ev.preventDefault();const f=Object.fromEntries(new FormData(ev.target)),u=me();if(!U(to)||to===u.id||blocked(u.id,to))return toast('Not allowed');
